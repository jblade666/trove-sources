[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trove-sources"
version = "0.1.0"
description = "Find share links on forums and blogs, and sync them with trove"
requires-python = ">=3.10"
# trove-downloader is installed from its own checkout; see README.
dependencies = ["requests>=2.31", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trove-sources = "trove_sources.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
